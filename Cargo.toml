[package]
name = "bitbankutil_rs"
version = "0.6.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Rust utilities for bitbank REST and WebSocket APIs, with trading bot and paper trading support."
repository = "https://github.com/Harui-i/bitbankutil_rs"
readme = "README.md"
documentation = "https://docs.rs/bitbankutil_rs"

[features]
# bitbankのAPIレスポンスをstructにする際に、使われていないフィールドを許容しないようにするfeature。
strict-validation = []
# 実際のbitbank Public APIを叩くテストを有効にするfeature。
live-public-api = []
# 実際のbitbank Private APIを叩く読み取り系テストを有効にするfeature。
live-private-api = []
# 実注文・キャンセルを伴うPrivate APIテストを有効にするfeature。
live-private-order-api = ["live-private-api"]

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["arbitrary_precision"] }
crypto-botters = { package = "crypto-botters-bitbank", version = "0.8.1", features = [
  "bitbank",
] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros"] }
tracing = "0.1"
serde_ignored = "0.1.14"
serde_path_to_error = "0.1.20"

[[bench]]
name = "queue_history"
harness = false

[[bench]]
name = "recording"
harness = false

[dev-dependencies]
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
