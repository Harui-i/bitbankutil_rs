name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo fmt --all --check

  test:
    runs-on: ubuntu-latest
    needs: fmt
    strategy:
      matrix:
        test_args: ["", "--features strict-validation"]
    steps:
      - uses: actions/checkout@v4
      - run: cargo test --locked --all-targets ${{ matrix.test_args }} --verbose
